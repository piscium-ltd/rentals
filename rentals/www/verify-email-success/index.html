{% extends "templates/web.html" %}

{% block page_content %}

<div style="
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background: #f5f5f5;
">

    <div style="
        width: 100%;
        max-width: 500px;
        background: #ffffff;
        padding: 45px 35px;
        text-align: center;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    ">

        <div style="
            width: 70px;
            height: 70px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: #28a745;
            color: #ffffff;
            font-size: 42px;
            line-height: 70px;
            font-weight: bold;
        ">
            ✓
        </div>

        <h2 style="
            margin-bottom: 15px;
            color: #333333;
        ">
            Email Verified Successfully
        </h2>

        <p style="
            margin-bottom: 10px;
            color: #666666;
            font-size: 16px;
            line-height: 1.6;
        ">
            Your email address has been verified successfully.
        </p>

        <p style="
            color: #666666;
            font-size: 16px;
            line-height: 1.6;
        ">
            Your identity record is now
            <strong style="color: #28a745;">Valid</strong>.
        </p>

    </div>

</div>

{% endblock %}
